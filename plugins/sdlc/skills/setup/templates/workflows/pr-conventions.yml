# Server-side mirror of the local hooks — cannot be skipped with --no-verify.
# Required check: `pr-conventions`. Pin actions by SHA at install.
name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: node tools/validate-branch-name.mjs "$BRANCH"

      # Header checks run only when the repo has a commitlint config — the
      # commit skill writes it; sdlc doesn't own the format.
      - name: PR title
        if: hashFiles('commitlint.config.*') != ''
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint --verbose

      - name: Commit headers
        if: hashFiles('commitlint.config.*') != ''
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE" --to "$HEAD" --verbose

      - name: Commit story + issue links
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          merges=$(git rev-list --merges "$BASE..$HEAD")
          if [ -n "$merges" ]; then
            echo "::error::Merge commits in PR — rebase onto main instead: $merges"
            fail=1
          fi

          fixups=$(git log --format='%h %s' "$BASE..$HEAD" | grep -E '^[0-9a-f]+ (fixup|squash|amend)!' || true)
          if [ -n "$fixups" ]; then
            echo "::error::Unsquashed fixup commits: $fixups"
            fail=1
          fi

          # Issue branches (<type>/<N>-<slug>) must link issue N in the body:
          # `Closes #N`, or `Refs #N` when the PR only partly delivers it.
          # Other branches (docs/<slug>, chore/<slug>-archive, chore/sync-<date>)
          # reference freely and close nothing required.
          issue=$(printf '%s' "$BRANCH" | sed -nE 's@^[a-z]+/([0-9]+)-.*@\1@p')
          if [ -n "$issue" ]; then
            if ! printf '%s' "$BODY" | grep -qiE "\b(close[sd]?|fix(e[sd])?|resolve[sd]?|refs:?) #$issue\b"; then
              echo "::error::PR body must contain 'Closes #$issue' (or 'Refs #$issue' for a partial PR)."
              fail=1
            fi
            refs_pattern="^Refs: (#$issue|none)\$"
          else
            refs_pattern='^Refs: (#[0-9]+|none)$'
          fi

          # Every commit: a Refs trailer; closing keywords belong in the PR body only.
          for sha in $(git rev-list "$BASE..$HEAD"); do
            msg=$(git log -1 --format=%B "$sha")
            label=$(git log -1 --format='%h %s' "$sha")
            if ! printf '%s\n' "$msg" | grep -qE "$refs_pattern"; then
              echo "::error::Commit $label lacks a trailer matching '$refs_pattern'."
              fail=1
            fi
            if printf '%s\n' "$msg" | grep -qiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?|ships:?) #[0-9]+'; then
              echo "::error::Commit $label carries a closing reference — put 'Closes #N' in the PR body instead."
              fail=1
            fi
          done
          exit $fail
